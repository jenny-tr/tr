<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<title>多重計時器</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#222;background:#f7f7f5}
*{box-sizing:border-box}
body{margin:0;padding:18px}
.app{max-width:760px;margin:auto}
h1{font-size:24px;margin:4px 0 18px}
.setup{display:grid;grid-template-columns:1fr 92px 92px auto;gap:8px;align-items:end}
label{display:block;font-size:12px;color:#777;margin-bottom:5px}
input{width:100%;padding:11px;border:1px solid #d8d8d4;border-radius:10px;background:white;font-size:16px}
button{min-height:44px;border:1px solid #d5d5d0;border-radius:10px;background:white;padding:8px 14px;font-size:15px;cursor:pointer}
button.primary{background:#ecece7;border-color:#aaa}
button.danger{color:#a33}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:14px}
.card{background:white;border:1px solid #dddcd7;border-radius:16px;padding:16px}
.head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.name{font-weight:700;font-size:17px;word-break:break-word}
.time{text-align:center;font-size:44px;font-weight:750;font-variant-numeric:tabular-nums;margin:15px 0 4px}
.status{text-align:center;color:#777;font-size:13px;min-height:20px}
.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty{text-align:center;color:#777;border:1px dashed #ccc;padding:22px;border-radius:14px;margin-top:14px}
@media(max-width:560px){
 body{padding:14px}
 .setup{grid-template-columns:1fr 1fr 1fr}
 .add{grid-column:1/-1}
 .time{font-size:38px}
}
</style>
</head>
<body>
<main class="app">
<h1>多重計時器</h1>
<div class="setup">
<div><label>名稱</label><input id="name" maxlength="30" placeholder="例如：第一段"></div>
<div><label>分鐘</label><input id="min" type="number" min="0" max="999" value="5"></div>
<div><label>秒</label><input id="sec" type="number" min="0" max="59" value="0"></div>
<button id="add" class="primary add">＋新增計時器</button>
</div>
<div id="list" class="grid"></div>
<div id="empty" class="empty">設定時間後，按「新增計時器」。<br>不同計時器可以同時倒數。</div>
</main>
<script>
(() => {
  const $=s=>document.querySelector(s);
  const list=$("#list"), empty=$("#empty"), name=$("#name"), min=$("#min"), sec=$("#sec");
  let timers=[], id=1, last=performance.now();

  const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt=x=>{
    x=Math.max(0,Math.ceil(x));
    return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0");
  };
  function render(){
    empty.style.display=timers.length?"none":"block";
    list.innerHTML=timers.map(t=>`
      <article class="card" data-id="${t.id}">
        <div class="head"><div class="name">${esc(t.name)}</div><button class="danger remove">刪除</button></div>
        <div class="time">${fmt(t.remaining)}</div>
        <div class="status">${t.done?"時間到":t.running?"倒數中…":"已暫停"}</div>
        <div class="actions">
          <button class="primary toggle">${t.running?"暫停":"開始"}</button>
          <button class="reset">重設</button>
        </div>
      </article>`).join("");
  }
  function addTimer(){
    const m=Math.max(0,Math.min(999,Number(min.value)||0));
    const s=Math.max(0,Math.min(59,Number(sec.value)||0));
    const total=m*60+s;
    if(total<=0){min.focus();return}
    const n=name.value.trim() || `計時器 ${id}`;
    timers.push({id:id++,name:n,total,remaining:total,running:false,done:false});
    name.value=""; render();
  }
  $("#add").addEventListener("click",addTimer);
  [name,min,sec].forEach(e=>e.addEventListener("keydown",x=>{if(x.key==="Enter")addTimer()}));
  list.addEventListener("click",e=>{
    const card=e.target.closest(".card"); if(!card)return;
    const t=timers.find(x=>x.id==card.dataset.id); if(!t)return;
    if(e.target.closest(".remove")){timers=timers.filter(x=>x!==t);render()}
    else if(e.target.closest(".reset")){t.remaining=t.total;t.running=false;t.done=false;render()}
    else if(e.target.closest(".toggle")){
      if(t.done){t.remaining=t.total;t.done=false}
      t.running=!t.running;render()
    }
  });
  function tick(now){
    const dt=Math.min(0.25,(now-last)/1000); last=now;
    let changed=false;
    timers.forEach(t=>{
      if(t.running&&!t.done){
        t.remaining-=dt; changed=true;
        if(t.remaining<=0){t.remaining=0;t.running=false;t.done=true; try{navigator.vibrate?.([250,120,250])}catch(e){}}
      }
    });
    if(changed)render();
    requestAnimationFrame(tick);
  }
  render(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
